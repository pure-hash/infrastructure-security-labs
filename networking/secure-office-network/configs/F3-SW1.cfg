enable
configure terminal
hostname F3-SW1
no ip domain-lookup
service password-encryption
enable secret (nope)
spanning-tree mode rapid-pvst

vlan 10
 name MANAGEMENT
vlan 30
 name OPERATIONS
vlan 50
 name IT
vlan 60
 name VOICE
vlan 80
 name PRINTERS
vlan 90
 name CAMERAS-IOT
vlan 999
 name PARKING-NATIVE
exit

interface vlan 10
 ip address 10.20.10.13 255.255.255.0
 no shutdown
exit
ip default-gateway 10.20.10.1

interface range fastEthernet0/1 - 8
 description IT_USER_PHONE
 switchport mode access
 switchport access vlan 50
 switchport voice vlan 60
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 3
 switchport port-security mac-address sticky
 switchport port-security violation restrict
exit

interface range fastEthernet0/9 - 16
 description MANAGEMENT_OPERATIONS_USER_PHONE
 switchport mode access
 switchport access vlan 30
 switchport voice vlan 60
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 3
 switchport port-security mac-address sticky
 switchport port-security violation restrict
exit

interface range fastEthernet0/17 - 18
 description FLOOR3_PRINTER
 switchport mode access
 switchport access vlan 80
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
exit

interface range fastEthernet0/19 - 20
 description FLOOR3_CAMERA_IOT
 switchport mode access
 switchport access vlan 90
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
exit

interface range fastEthernet0/21 - 24
 description UNUSED_PARKING
 switchport mode access
 switchport access vlan 999
 shutdown
exit

interface gigabitEthernet0/1
 description TRUNK_TO_CORE-SW1_FA0/22
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,30,50,60,80,90,999
 no shutdown
exit

interface gigabitEthernet0/2
 description UNUSED_PARKING
 switchport mode access
 switchport access vlan 999
 shutdown
exit

ip domain-name evanlab.local
username netadmin privilege 15 secret (nope)
crypto key generate rsa modulus 1024
ip ssh version 2
ip access-list standard MGMT-SSH
 permit 10.20.50.0 0.0.0.255
 deny any
exit
line vty 0 4
 login local
 transport input ssh
 access-class MGMT-SSH in
 exec-timeout 10 0
exit
line console 0
 logging synchronous
exit
banner motd # Authorized lab access only #
end
write memory
