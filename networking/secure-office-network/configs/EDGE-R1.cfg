enable
configure terminal
hostname EDGE-R1
no ip domain-lookup
service password-encryption
enable secret (nope)

interface gigabitEthernet0/0
 description OUTSIDE_TO_ISP-R1_G0/0
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown
exit

interface gigabitEthernet0/1
 description INSIDE_TO_CORE-SW1_G0/1
 ip address 10.20.254.1 255.255.255.252
 ip nat inside
 no shutdown
exit

ip route 10.20.0.0 255.255.0.0 10.20.254.2
ip route 0.0.0.0 0.0.0.0 203.0.113.1

access-list 1 permit 10.20.0.0 0.0.255.255
ip nat inside source list 1 interface gigabitEthernet0/0 overload

ip domain-name evanlab.local
username netadmin privilege 15 secret (nope)
crypto key generate rsa modulus 1024
ip ssh version 2

ip access-list standard MGMT-SSH
 permit 10.20.50.0 0.0.0.255
 deny any
exit

line console 0
 logging synchronous
 exec-timeout 10 0
exit

line vty 0 4
 login local
 transport input ssh
 access-class MGMT-SSH in
 exec-timeout 10 0
exit

banner motd # Authorized lab access only #
end
write memory
